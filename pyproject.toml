[project]
name = "helios-nephrite-writer"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.9.0",
    "pydantic>=2.11.3",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "mock>=5.2.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]
